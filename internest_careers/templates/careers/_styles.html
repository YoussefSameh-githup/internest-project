{# Page CSS for the career pages (embedded so it ships even with an old cached stylesheet). Builds on the sh-* hub styles. #}
<style>
.cr-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.cr-intro h2 { margin: 0 0 4px; font-size: var(--text-xl); }
.cr-intro p { margin: 0; color: #64748b; font-size: var(--text-sm); max-width: 640px; }
.cr-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.cr-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 88px; }
.cr-card { padding: 18px; border-radius: 18px; background: #fff; border: 1px solid #e8edf5; box-shadow: 0 1px 3px rgba(15, 23, 42, .04); min-width: 0; }
.cr-card h3 { margin: 0 0 6px; font-size: var(--text-base); }
.cr-card > p { margin: 0 0 12px; color: #64748b; font-size: var(--text-sm); }
.cr-roles { display: grid; gap: 16px; }
.cr-role__top { display: flex; align-items: flex-start; gap: 12px; }
.cr-role__who { flex: 1; min-width: 0; }
.cr-role__title { margin: 0; font-size: var(--text-lg); line-height: 1.3; overflow-wrap: anywhere; }
.cr-role__sub { color: #64748b; font-size: var(--text-xs); }
.cr-meter { flex-shrink: 0; min-width: 64px; padding: 6px 10px; border-radius: 14px; background: #eef2ff; color: #3730a3; text-align: center; font-weight: 800; }
.cr-meter b { display: block; font-size: 1.25rem; line-height: 1.1; direction: ltr; }
.cr-meter small { font-size: 10px; font-weight: 700; color: #6366f1; }
.cr-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: var(--text-xs); font-weight: 700; }
.cr-pill--ready { background: #dcfce7; color: #166534; }
.cr-pill--almost { background: #fef3c7; color: #92400e; }
.cr-pill--foundations { background: #f1f5f9; color: #475569; }
.cr-why { margin: 10px 0; color: #334155; font-size: var(--text-sm); }
.cr-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.cr-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid #e2e8f0; background: #f8fafc; color: #334155; font-size: var(--text-xs); font-weight: 600; }
.cr-chip--verified { background: #ecfdf5; border-color: #bbf7d0; color: #166534; }
.cr-chip--related { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
.cr-chip--claimed { background: #fffbeb; border-color: #fde68a; color: #92400e; }
.cr-chip--missing { background: #fff; border-style: dashed; color: #64748b; }
.cr-gaps { margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 10px; }
.cr-gaps > summary { cursor: pointer; font-weight: 700; font-size: var(--text-sm); color: #1e3a8a; padding: 6px 0; min-height: 40px; display: flex; align-items: center; gap: 6px; }
.cr-gap { padding: 12px; margin-top: 8px; border-radius: 14px; background: #f8fafc; border: 1px solid #eef2f7; }
.cr-gap h4 { margin: 0 0 4px; font-size: var(--text-sm); }
.cr-gap p { margin: 0 0 8px; color: #475569; font-size: var(--text-xs); }
.cr-links { display: flex; flex-direction: column; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; }
.cr-links a { display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px solid #e8edf5; color: #0f172a; text-decoration: none; font-size: var(--text-xs); font-weight: 600; overflow-wrap: anywhere; }
.cr-links a:hover { border-color: #c7d2fe; }
.cr-links small { color: #64748b; font-weight: 500; }
.cr-project { padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px dashed #c7d2fe; font-size: var(--text-xs); color: #334155; }
.cr-project strong { display: block; color: #312e81; margin-bottom: 2px; }
.cr-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.cr-actions .btn { min-height: 40px; }
.cr-fit { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.cr-fit li { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #f8fafc; border: 1px solid #eef2f7; min-width: 0; }
.cr-fit__row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.cr-fit__row a { color: #0f172a; font-weight: 700; text-decoration: none; overflow-wrap: anywhere; min-width: 0; }
.cr-fit__row a:hover { color: var(--brand-500); }
.cr-fit small { color: #64748b; font-size: var(--text-xs); }
.cr-plan { margin-top: 10px; font-size: var(--text-sm); color: #334155; }
.cr-plan ol { margin: 8px 0 0; padding-inline-start: 20px; }
.cr-plan [role=alert] { color: #b91c1c; }

/* Interview kits */
.ik-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ik-head h1 { margin: 0 0 4px; font-size: var(--text-2xl); overflow-wrap: anywhere; }
.ik-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
.ik-note { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; font-size: var(--text-sm); }
.ik-note--warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
.ik-list { margin: 18px 0 0; padding: 0; list-style: none; counter-reset: q; display: grid; gap: 14px; }
.ik-q { counter-increment: q; padding: 16px 18px; border-radius: 16px; background: #fff; border: 1px solid #e8edf5; min-width: 0; }
.ik-q__top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.ik-q__top::before { content: counter(q); display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #1e3a8a; color: #fff; font-weight: 800; font-size: 13px; flex-shrink: 0; }
.ik-q h3 { margin: 0 0 8px; font-size: var(--text-base); line-height: 1.45; overflow-wrap: anywhere; }
.ik-q dl { margin: 0; display: grid; gap: 8px; }
.ik-q dt { font-size: var(--text-xs); font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: .03em; }
.ik-q dd { margin: 2px 0 0; color: #334155; font-size: var(--text-sm); }
.ik-q ul { margin: 2px 0 0; padding-inline-start: 18px; }
.ik-q details > summary { cursor: pointer; font-weight: 700; font-size: var(--text-sm); color: #1e3a8a; min-height: 40px; display: flex; align-items: center; }
.ik-diff { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; }
.ik-diff--easy { background: #dcfce7; color: #166534; }
.ik-diff--medium { background: #fef3c7; color: #92400e; }
.ik-diff--hard { background: #fee2e2; color: #991b1b; }
.ik-form { display: grid; gap: 14px; margin-top: 14px; }
.ik-form label { display: grid; gap: 6px; font-weight: 700; font-size: var(--text-sm); }
.ik-form select, .ik-form input[type=text] { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid #cbd5e1; background: #fff; font: inherit; font-weight: 500; }
.ik-form .ik-check { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.ik-form .ik-check input { width: 20px; height: 20px; flex-shrink: 0; }
.ik-form small { color: #64748b; font-weight: 500; }
.ik-kits { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.ik-kits a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid #e8edf5; color: #0f172a; text-decoration: none; min-height: 48px; }
.ik-kits a:hover { border-color: #c7d2fe; }
.ik-kits span { min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
.ik-kits small { flex-shrink: 0; color: #64748b; font-size: var(--text-xs); }
@media (max-width: 1023px) { .cr-layout { grid-template-columns: 1fr; } .cr-side { position: static; } }
@media (max-width: 767px) {
  .cr-role__top { flex-wrap: wrap; }
  .cr-actions .btn, .ik-actions .btn { flex: 1 1 100%; justify-content: center; }
  .ik-q { padding: 14px; }
}
@media print { .no-print { display: none !important; } }
</style>
