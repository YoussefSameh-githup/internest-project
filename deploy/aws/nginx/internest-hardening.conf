# /etc/nginx/conf.d/internest-hardening.conf  (http context; installed by deploy/aws/apply_nginx.sh)
server_tokens off;                      # no nginx version in headers and error pages

# Per-client limit for the auth paths in sites-available/internest (20 requests/minute, burst 20).
limit_req_zone $binary_remote_addr zone=internest_auth:10m rate=20r/m;
limit_req_status 429;
