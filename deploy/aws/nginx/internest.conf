# /etc/nginx/sites-available/internest  (installed by deploy/aws/apply_nginx.sh)
#
# - /media/ has NO general alias on purpose: uploads go through Django's serve_protected_media, which checks login and
#   ownership. CVs, recommendation letters and payment receipts are private, and an nginx alias would skip those checks.
#   The only exception is the public company-logo folder below.
# - Static files are served by nginx (public, hashed by collectstatic).
# - proxy_params overwrites X-Real-IP / X-Forwarded-Proto with nginx's own values, so a client cannot spoof them. Behind
#   Cloudflare, conf.d/cloudflare-realip.conf turns $remote_addr into the visitor's address first.
server {
    listen 80;
    server_name 16.171.20.95 internest.me www.internest.me;

    client_max_body_size 21M;   # Django caps a request at 20 MB (MAX_REQUEST_BYTES); +1 MB for multipart framing
    client_body_timeout 30s;
    client_header_timeout 15s;

    location /static/ {
        alias /home/ubuntu/internest/staticfiles/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Company logos are public branding (shown on public company and opportunity pages), so they are the ONE upload
    # folder nginx serves directly, with the same sandbox headers Django puts on uploads. nginx normalises the URI
    # ("..", %2e%2e) before matching, so this prefix cannot reach another folder. Everything else under /media/ falls
    # through to Django.
    location /media/partner_logos/ {
        alias /home/ubuntu/internest/media/partner_logos/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Sign-in, sign-up, password reset and e-mail codes: stop floods at the edge before they tie up gunicorn's 4
    # threads. Django still applies its own per-IP / per-account limits (internest_core/ratelimit.py).
    location ~ ^/(accounts/(login|signup|password_reset|verify-email)|startups/register)/ {
        limit_req zone=internest_auth burst=20 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
    }
}
