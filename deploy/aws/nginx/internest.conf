# /etc/nginx/sites-available/internest  (installed by deploy/aws/apply_nginx.sh)
# https://internest.app behind Cloudflare, SSL mode "Full (strict)".
#
# - TLS: Cloudflare Origin Certificate in /etc/nginx/ssl/internest-origin.{pem,key} (root-only key, never in git).
# - Origin guard: $from_cloudflare (conf.d/cloudflare-origin-guard.conf, written by update_cloudflare_ips.sh) is 1 only
#   for connections from Cloudflare's published ranges or the box itself. Anything else (a scanner hitting the IP,
#   someone bypassing Cloudflare's WAF/rate limits) gets the connection closed (444). It tests $realip_remote_addr, the
#   real TCP peer, so the CF-Connecting-IP rewrite in cloudflare-realip.conf cannot be used to slip past it.
# - /media/ has NO general alias on purpose: uploads go through Django's serve_protected_media, which checks login and
#   ownership. CVs, recommendation letters and payment receipts are private, and an nginx alias would skip those checks.
#   The only exception is the public company-logo folder below.
# - proxy_params overwrites X-Real-IP / X-Forwarded-Proto with nginx's own values, so a client cannot spoof them.

server {
    listen 80;
    server_name internest.app www.internest.app;

    if ($from_cloudflare = 0) { return 444; }
    return 301 https://internest.app$request_uri;   # one hop, straight to the canonical host
}

# www → apex: one canonical host for users, links and search engines (Django's canonical tags use SITE_URL too).
server {
    listen 443 ssl;
    server_name www.internest.app;

    ssl_certificate /etc/nginx/ssl/internest-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/internest-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($from_cloudflare = 0) { return 444; }
    return 301 https://internest.app$request_uri;
}

server {
    listen 443 ssl;
    server_name internest.app;

    ssl_certificate /etc/nginx/ssl/internest-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/internest-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($from_cloudflare = 0) { return 444; }

    client_max_body_size 21M;   # Django caps a request at 20 MB (MAX_REQUEST_BYTES); +1 MB for multipart framing
    client_body_timeout 30s;
    client_header_timeout 15s;

    # collectstatic writes content-hashed names (styles.<hash>.css), so a file never changes under its URL: cache it
    # for a year (browsers and Cloudflare) instead of the 4-hour default, and serve the pre-compressed copies.
    location /static/ {
        alias /home/ubuntu/internest/staticfiles/;
        gzip_static on;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Company logos are public branding, so they are the ONE upload folder nginx serves directly, with the same
    # sandbox headers Django puts on uploads. nginx normalises the URI ("..", %2e%2e) before matching, so this prefix
    # cannot reach another folder. Everything else under /media/ falls through to Django.
    location /media/partner_logos/ {
        alias /home/ubuntu/internest/media/partner_logos/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Sign-in, sign-up, password reset and e-mail codes: stop floods before they tie up gunicorn's 4 threads.
    # Django still applies its own per-IP / per-account limits (internest_core/ratelimit.py).
    location ~ ^/(accounts/(login|signup|password_reset|verify-email)|startups/register)/ {
        limit_req zone=internest_auth burst=20 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
    }
}
