# Internest behind nginx. __DOMAIN__ is filled in by setup.sh; certbot adds the HTTPS (443) part to this block.

# Requests for any other host name (bots scanning the IP): close the connection without an answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 21m;  # Django refuses bodies over MAX_REQUEST_BYTES (20 MB) itself

    # Everything goes to Django: static files are served by WhiteNoise, and /media/ MUST go through
    # serve_protected_media (CVs, receipts and certificates are private), so there is no alias for it here.
    location / {
        proxy_pass http://unix:/run/internest/gunicorn.sock;
        proxy_set_header Host $host;
        # Set from the real connection, overwriting whatever the client sent: the rate limiter trusts X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 125s;
    }
}
