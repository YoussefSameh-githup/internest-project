{% load i18n %}
<div class="card campus-cta mb-5" style="background: linear-gradient(135deg, #fff7ed, #fffbeb); border: 1px solid #fde68a; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap;">
    <div>
        <h3 class="mb-2"><i class="bi bi-megaphone-fill" style="color: var(--accent-700);"></i> {% trans "Is your faculty not on Internest yet?" %}</h3>
        <p class="text-muted mb-0">{% trans "Vote for your campus, share your card, and help your classmates reach 500 votes." %}</p>
    </div>
    <a href="{% url 'campus_vote' %}?open=1" class="btn btn--accent btn--lg">
        <i class="bi bi-hand-index-thumb"></i> {% trans "Bring Internest to My Campus" %}
    </a>
</div>
