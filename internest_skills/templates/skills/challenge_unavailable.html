{% extends 'internship/base.html' %}
{% load i18n %}

{% block title %}{{ skill.name }} — Internest{% endblock %}

{% block content %}
<section class="section">
    <div class="container-narrow">
        <div class="card text-center">
            <i class="bi bi-hourglass-split" style="font-size: 3rem; color: var(--color-accent, #f59e0b);"></i>
            <h2 class="mt-3">{{ skill.name }}</h2>
            <p class="text-muted">{{ message }}</p>
            <a href="{% url 'skills_hub' %}" class="btn btn--primary mt-3"><i class="bi bi-arrow-right-short"></i> {% trans "Back to my skills" %}</a>
        </div>
    </div>
</section>
{% endblock %}
