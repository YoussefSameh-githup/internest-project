{# Circular progress. Context: value (0-100), label. #}<div class="px-ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ value }}" aria-label="{{ label }}">
    <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="px-ring__track" cx="60" cy="60" r="52" pathLength="100"></circle>
        <circle class="px-ring__fill" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="{{ value }} 100"></circle>
    </svg>
    <span class="px-ring__text"><strong>{{ value }}%</strong><small>{{ label }}</small></span>
</div>
