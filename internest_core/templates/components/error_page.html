{# Branded error body used by 403 / 404 / 500. Context: code, emoji, title, text, home_url, home_label. Carries its own CSS so it works without the site stylesheet. #}
<style>
.ep { min-height: 52vh; display: grid; place-items: center; padding: 56px 16px; text-align: center; font-family: "Cairo", "Inter", system-ui, sans-serif; }
.ep__card { max-width: 520px; padding: 40px 28px; border-radius: 26px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 18px 46px rgba(15, 23, 42, .08); }
.ep__code { display: block; font-size: clamp(3.4rem, 12vw, 5rem); line-height: 1; font-weight: 800; color: #5b3fd6; letter-spacing: -.02em; }
.ep__emoji { display: block; margin-bottom: 8px; font-size: 2.2rem; }
.ep h1 { margin: 14px 0 8px; font-size: clamp(1.35rem, 4vw, 1.75rem); color: #0f172a; }
.ep p { margin: 0 0 22px; color: #64748b; line-height: 1.8; }
.ep__home { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 14px; color: #fff; font-weight: 800; text-decoration: none;
  background: linear-gradient(135deg, #6a4cff, #7c3aed); box-shadow: 0 10px 24px rgba(79, 70, 229, .3); }
.ep__home:hover { color: #fff; filter: brightness(1.06); }
</style>
<section class="ep">
    <div class="ep__card">
        <span class="ep__emoji" aria-hidden="true">{{ emoji }}</span>
        <span class="ep__code">{{ code }}</span>
        <h1>{{ title }}</h1>
        <p>{{ text }}</p>
        <a href="{{ home_url|default:'/' }}" class="ep__home">{{ home_label }}</a>
    </div>
</section>
