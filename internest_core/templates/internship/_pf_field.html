<div class="pf-field{% if full %} pf-field--full{% endif %}{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="pf-label">{{ field.label }}</label>
    {{ field }}
    {% if help %}<small class="pf-help">{{ help }}</small>{% endif %}
    {% if field.errors %}<div class="form-error">{{ field.errors|striptags }}</div>{% endif %}
</div>
