<style>
/* Student Hub — embedded so the design ships even when the server serves an old cached stylesheet. */
.px { --px-brand: #2563eb; --px-brand-2: #7c3aed; --px-ink: #0f172a; --px-muted: #64748b; --px-line: #e2e8f0; --px-soft: #f8fafc;
  --px-ok: #16a34a; --px-warn: #c2410c; padding: 28px 0 64px; background: radial-gradient(900px 380px at 85% -10%, #dbeafe, transparent 70%),
  radial-gradient(700px 320px at 0% 0%, #ede9fe, transparent 65%), #f8fafc; }
.px-card { position: relative; padding: 22px; border-radius: 22px; background: rgba(255, 255, 255, .86); backdrop-filter: blur(12px);
  border: 1px solid rgba(226, 232, 240, .9); box-shadow: 0 10px 30px rgba(15, 23, 42, .05); transition: box-shadow .2s, transform .2s, border-color .2s; }

.px-card__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.px-card__title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.08rem; color: var(--px-ink); }
.px-card__title .px-ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: #eff6ff; color: var(--px-brand); font-size: 1.05rem; }

.px-me__top { display: flex; gap: 16px; align-items: center; min-width: 0; margin-bottom: 4px; }
.px-me__id { min-width: 0; flex: 1 1 auto; }
.px-avatar { position: relative; flex: 0 0 84px; width: 84px; height: 84px; }
.px-avatar__img { display: grid; place-items: center; width: 84px; height: 84px; aspect-ratio: 1 / 1; border-radius: 50%; overflow: hidden;

.px-avatar__img img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.px-avatar__btn { display: block; width: 84px; height: 84px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }

.px-avatar__btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
.px-lightbox { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 24px; border: 0; background: transparent; place-items: center; overflow: hidden; }
.px-lightbox[open] { display: grid; }
.px-lightbox::backdrop { background: rgba(15, 23, 42, .78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.px-lightbox__img { display: block; max-width: 90vw; max-height: 85vh; width: auto; height: auto; object-fit: contain; border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); background: #0f172a; }
.px-lightbox__close { position: absolute; top: 16px; inset-inline-end: 16px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .16); color: #fff;

.px-lightbox__close:hover { background: rgba(255, 255, 255, .3); }
.px-lightbox__close:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
.px-avatar__check { position: absolute; bottom: 0; inset-inline-end: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: #22c55e; color: #fff; font-size: 13px; border: 3px solid #1e3a8a; }
.px-name { margin: 0; font-size: 1.3rem; color: #fff; overflow-wrap: anywhere; }
.px-handle { color: #93c5fd; font-size: 13px; font-weight: 700; }
.px-meta { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 0; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .14); color: #cbd5e1; font-size: 13.5px; }
.px-meta span { display: flex; align-items: flex-start; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.px-meta i { margin-top: 2px; }
.px-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.px-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; text-decoration: none; }
.px-badge--ok { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
.px-badge--warn { background: #ffedd5; color: #9a3412; border-color: #fed7aa; }
.px-badge--gold { background: #fef9c3; color: #854d0e; border-color: #fde68a; }
a.px-badge:hover { border-color: var(--px-brand); color: var(--px-brand); }
.px-ready { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.px-ready__text { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 220px; font-size: 13.5px; color: #475569; }

.px-ring { position: relative; flex-shrink: 0; width: 96px; height: 96px; }
.px-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.px-ring circle { fill: none; stroke-width: 10; }
.px-ring__track { stroke: #e2e8f0; }
.px-ring__fill { stroke: #16a34a; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.px-ring__text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.px-ring__text strong { color: var(--px-ink); font-size: 1.3rem; }
.px-ring__text small { font-size: 9.5px; color: var(--px-muted); }
.px-cta-main { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 16px; border-radius: 16px; border: 0; color: #fff; text-decoration: none;
  font: inherit; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #22c55e, #059669); box-shadow: 0 12px 26px rgba(16, 185, 129, .4); transition: transform .15s; }
.px-cta-main:hover { transform: translateY(-2px); color: #fff; }
.px-quick { display: grid; gap: 8px; }
.px-quick a, .px-quick button { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14);
  color: #e2e8f0; font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; text-align: start; }

/* Tabs */

  overflow-x: auto; scrollbar-width: none; position: sticky; top: 76px; z-index: 4; box-shadow: 0 8px 20px rgba(15, 23, 42, .05); }
.px-tab { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 13px;

.px-tab:hover { background: #f1f5f9; color: var(--px-ink); }

.px-tab b { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 11px; background: #fee2e2; color: #b91c1c; }

/* Accordion sections (Edit profile) */

.px-acc > summary::-webkit-details-marker { display: none; }
.px-acc > summary::after { content: "\F282"; font-family: "bootstrap-icons"; margin-inline-start: auto; color: var(--px-muted); transition: transform .2s; }
.px-acc[open] > summary::after { transform: rotate(180deg); }
.px-acc > summary small { font-weight: 500; color: var(--px-muted); }
.px-acc__body { padding: 2px 20px 20px; }
.px-acc .px-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: #eff6ff; color: var(--px-brand); }

/* Form fields inside cards */
.px .pf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

.px-savebar { position: sticky; bottom: 12px; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-radius: 18px; background: rgba(15, 23, 42, .92); color: #e2e8f0; box-shadow: 0 16px 34px rgba(15, 23, 42, .3); }

.px-ghost { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 11px; border: 1px solid var(--px-line); background: #fff;

.px-ghost:hover { border-color: var(--px-brand); color: var(--px-brand); }
.px-edu { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.px-edu li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 14px; background: var(--px-soft); border: 1px solid #eef2f7; font-size: 14px; }
.px-edu span { color: var(--px-muted); }
.px-links { display: flex; flex-wrap: wrap; gap: 8px; }

/* Skills */
.px-legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 14px; color: var(--px-muted); font-size: 12.5px; }
.px-legend span { display: inline-flex; align-items: center; gap: 6px; }
.px-dot { width: 10px; height: 10px; border-radius: 50%; }
.px-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.px-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; border: 1px solid; }
.px-chip--verified { background: #f0fdf4; border-color: #bbf7d0; color: #14532d; }
.px-chip--explicit { background: #eff6ff; border-color: #bfdbfe; color: #1e3a8a; }
.px-chip--inferred { background: #faf5ff; border-color: #e9d5ff; border-style: dashed; color: #581c87; }

.px-group + .px-group { margin-top: 16px; }
.px-group h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; color: #334155; }
.px-empty { padding: 18px; border-radius: 16px; border: 1px dashed #cbd5e1; color: var(--px-muted); text-align: center; font-size: 14px; }
.px-primary { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 13px; color: #fff; font: inherit; font-weight: 800;
  background: linear-gradient(135deg, var(--px-brand), var(--px-brand-2)); box-shadow: 0 10px 22px rgba(79, 70, 229, .3); cursor: pointer; text-decoration: none; }
.px-primary:hover { color: #fff; filter: brightness(1.05); }
.px-dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; padding: 24px; border: 0; border-radius: 22px; box-shadow: 0 30px 70px rgba(15, 23, 42, .35); }
.px-dialog::backdrop { background: rgba(15, 23, 42, .5); backdrop-filter: blur(3px); }
.px-options { display: grid; gap: 10px; margin: 14px 0 0; }
.px-option { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 1px solid var(--px-line); color: var(--px-ink); text-decoration: none; }
.px-option:hover { border-color: var(--px-brand); background: #eff6ff; color: var(--px-ink); }
.px-option > span:first-child { font-size: 1.6rem; }
.px-option small { display: block; color: var(--px-muted); }

/* Portfolio */
.px-gigs { display: grid; gap: 12px; }
.px-gig { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 14px; border-radius: 18px; background: var(--px-soft); border: 1px solid #eef2f7; }
.px-gig__logo { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-weight: 800; }
.px-gig__top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.px-gig__top strong { color: var(--px-ink); }
.px-gig__meta { color: var(--px-muted); font-size: 13px; overflow-wrap: anywhere; }
.px-pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.px-pill--verified { background: #dcfce7; color: #166534; }
.px-pill--pending { background: #fef3c7; color: #92400e; }
.px-pill--needs_proof { background: #ffedd5; color: #9a3412; }
.px-pill--rejected { background: #fee2e2; color: #991b1b; }
.px-alert { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: #fff7ed;
  border: 1px solid #fed7aa; color: #7c2d12; font-size: 13px; }
.px-alert p { flex: 1 1 220px; margin: 0; }
.px-upload { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 11px; background: #ea580c; color: #fff; font-weight: 800; cursor: pointer; }
.px-upload:hover { background: #c2410c; }
.px-upload input { display: none; }
.px-projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.px-project { padding: 14px; border-radius: 16px; background: var(--px-soft); border: 1px solid #eef2f7; }
.px-project strong { display: block; color: var(--px-ink); }
.px-project p { margin: 4px 0 6px; color: #475569; font-size: 13.5px; }
.px-project small { color: var(--px-muted); }

/* Settings */
.px-setting { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.px-setting + .px-setting { margin-top: 14px; padding-top: 14px; border-top: 1px solid #f1f5f9; }
.px-setting p { margin: 2px 0 0; color: var(--px-muted); font-size: 13px; }
.px-select { min-width: 220px; padding: 9px 12px; border-radius: 12px; border: 1px solid #cbd5e1; font: inherit; background: #fff; }
.px-toggle { position: relative; display: inline-flex; flex-shrink: 0; }
.px-toggle input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.px-toggle span { width: 48px; height: 28px; border-radius: 999px; background: #cbd5e1; transition: .2s; position: relative; }
.px-toggle span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); }
.px-toggle input:checked + span { background: var(--px-ok); }
.px-toggle input:checked + span::after { inset-inline-start: 23px; }
.px-toggle input:focus-visible + span { outline: 3px solid #93c5fd; outline-offset: 2px; }


/* Overview: verified badges, skill cards, activity rows */
.px-sbadges { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.px-sbadge { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: linear-gradient(135deg, #f0fdf4, #ecfeff); border: 1px solid #bbf7d0; }
.px-sbadge__seal { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: #16a34a; color: #fff; font-size: 1.2rem; flex-shrink: 0; }
.px-sbadge__body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; align-items: flex-start; }
.px-sbadge__body strong { color: #14532d; overflow-wrap: anywhere; }
.px-sbadge__score { text-align: end; line-height: 1.1; }
.px-sbadge__score b { display: block; font-size: 1.25rem; color: #166534; }
.px-sbadge__score small { color: #15803d; font-weight: 700; }
.px-primary--sm { padding: 8px 13px; font-size: 13px; border-radius: 11px; }
.px-bio { margin: 0; white-space: pre-line; overflow-wrap: anywhere; color: #334155; }
.px-empty__icon { display: block; margin-bottom: 6px; font-size: 1.6rem; opacity: .6; }

@media (min-width: 768px) and (max-width: 1100px) { .px-me { padding: 22px 26px; } .px-me__top { gap: 20px; } .px-quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .px-bento, .px .pf-grid, .px-projects { grid-template-columns: 1fr; }
  .px-me { padding: 18px; }
  .px-quick small { display: none; }
}
@media (max-width: 520px) { .px-tabs { position: static; } .px-tab { flex: 0 0 auto; } .px-select { min-width: 0; width: 100%; } .px-ready { justify-content: center; text-align: center; } .px-missing { justify-content: center; } }
</style>
