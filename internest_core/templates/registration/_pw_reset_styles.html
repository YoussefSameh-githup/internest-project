<style>
/* Forgot-password pages: step indicator, code field, resend link (on top of _pw_shell.html). */
.pwr-steps { display: flex; gap: 6px; margin: 0 0 20px; padding: 0; list-style: none; counter-reset: pwr; }
.pwr-steps li { flex: 1; padding: 8px 6px; border-radius: 10px; background: #f1f5f9; color: #475569; font-size: 13px; font-weight: 700; text-align: center; counter-increment: pwr; }
.pwr-steps li::before { content: counter(pwr) " · "; }
.pwr-steps li.is-current { background: #5b3fd6; color: #fff; }
.pwr-steps li.is-done { background: #dcfce7; color: #166534; }
.pwr-code { letter-spacing: .5em; font-size: 1.35rem !important; font-weight: 800; text-align: center; font-family: "Courier New", monospace; }
.pwr-resend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.pwr-link { border: 0; background: none; padding: 6px 0; color: #5b3fd6; font: inherit; font-weight: 700; cursor: pointer; }
.pwr-link:disabled { color: #64748b; cursor: not-allowed; }
.pwr-link:focus-visible { outline: 3px solid #b7a6ff; outline-offset: 2px; border-radius: 6px; }
.pwr-wait { color: #475569; font-size: 13px; }
.pwr-note { margin: 16px 0 0; color: #475569; font-size: 13.5px; line-height: 1.6; }
.pwr-note a { color: #5b3fd6; font-weight: 700; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.pw-forgot { display: inline-block; margin-top: 2px; padding-block: 6px; font-size: 14px; font-weight: 700; color: #5b3fd6; }
</style>
