{% load i18n %}
<style>
/* Account security pages — embedded to match the Student Hub even with an old cached stylesheet. */
.pw { --pw-brand: #2563eb; --pw-brand-2: #7c3aed; --pw-ink: #0f172a; --pw-muted: #64748b; --pw-line: #e2e8f0;
  min-height: 70vh; display: grid; place-items: center; padding: 48px 16px 72px;
  background: radial-gradient(800px 360px at 85% -10%, #dbeafe, transparent 70%), radial-gradient(640px 300px at 0% 10%, #ede9fe, transparent 65%), #f8fafc; }
.pw-card { width: min(480px, 100%); padding: 32px 28px 26px; border-radius: 26px; background: rgba(255, 255, 255, .82); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(226, 232, 240, .9); box-shadow: 0 30px 70px rgba(15, 23, 42, .12); }
.pw-icon { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; font-size: 1.6rem; color: #fff;
  background: linear-gradient(135deg, var(--pw-brand), var(--pw-brand-2)); box-shadow: 0 14px 30px rgba(79, 70, 229, .35); }
.pw-icon--ok { background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: 0 14px 30px rgba(22, 163, 74, .35); }
.pw-card h1 { margin: 0 0 6px; text-align: center; font-size: 1.5rem; color: var(--pw-ink); }
.pw-lead { margin: 0 0 22px; text-align: center; color: var(--pw-muted); font-size: 14.5px; }
.pw-field { margin-bottom: 16px; }
.pw-field label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 14px; color: #334155; }
.pw-input { position: relative; direction: ltr; }  /* passwords are LTR; keeps the eye button and padding on the same side */
.pw-input input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px; padding-inline-end: 46px; border: 1px solid #cbd5e1; border-radius: 14px;
  background: #fff; font: inherit; color: var(--pw-ink); direction: ltr; text-align: start; transition: border-color .15s, box-shadow .15s; }
.pw-input input:focus { outline: none; border-color: var(--pw-brand); box-shadow: 0 0 0 4px rgba(37, 99, 235, .15); }
.pw-field.has-error input { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, .1); }
.pw-toggle { position: absolute; top: 50%; inset-inline-end: 6px; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 10px;
  background: none; color: var(--pw-muted); cursor: pointer; font-size: 1.1rem; }
.pw-toggle:hover { background: #f1f5f9; color: var(--pw-ink); }
.pw-error { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; color: #b91c1c; font-size: 13px; }
.pw-error ul { margin: 0; padding: 0; list-style: none; }
.pw-alert { margin-bottom: 16px; padding: 10px 14px; border-radius: 12px; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; font-size: 14px; }
.pw-meter { height: 6px; margin-top: 10px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
.pw-meter span { display: block; height: 100%; width: 0; border-radius: inherit; transition: width .2s, background .2s; }
.pw-rules { display: grid; gap: 4px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--pw-muted); }
.pw-rules li { display: flex; align-items: center; gap: 6px; }
.pw-rules li::before { content: "○"; width: 14px; text-align: center; }
.pw-rules li.is-ok { color: #15803d; }
.pw-rules li.is-ok::before { content: "✓"; font-weight: 800; }
.pw-match { margin-top: 6px; font-size: 13px; }
.pw-primary { width: 100%; height: 50px; margin-top: 6px; border: 0; border-radius: 14px; color: #fff; font: inherit; font-weight: 800; font-size: 1rem; cursor: pointer;
  background: linear-gradient(135deg, var(--pw-brand), var(--pw-brand-2)); box-shadow: 0 14px 28px rgba(79, 70, 229, .35); transition: transform .15s, filter .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.pw-primary:hover { transform: translateY(-1px); filter: brightness(1.06); color: #fff; }
.pw-back { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; color: var(--pw-muted); font-weight: 700; font-size: 14px; text-decoration: none; }
.pw-back:hover { color: var(--pw-brand); }
@media (max-width: 480px) { .pw-card { padding: 26px 18px 22px; } }
</style>
